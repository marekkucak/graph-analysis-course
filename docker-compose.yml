version: "3.9"

services:
  neo4j:
    image: neo4j:5.14-community
    container_name: pe-graph-neo4j
    environment:
      NEO4J_AUTH: neo4j/your_password_here
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_memory_heap_maxSize: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
    ports:
      - "7474:7474"  # Browser
      - "7687:7687"  # Bolt
    volumes:
      - neo4j-data:/var/lib/neo4j/data
      - neo4j-logs:/var/lib/neo4j/logs
      - ./cypher:/var/lib/neo4j/cypher
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  neo4j-data:
    driver: local
  neo4j-logs:
    driver: local

networks:
  default:
    name: pe-graph-network
