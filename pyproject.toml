[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pe-graph-value-masterclass"
version = "1.0.0"
description = "Graph thinking, analytics, and algorithms through runnable local notebooks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Graph Masterclass", email = "contact@example.com"}
]

dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "networkx>=3.2",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.4.0",
    "faker>=22.0.0",
    "duckdb>=0.9.0",
    "neo4j>=5.14.0",
    "graphdatascience>=1.14.0",
    "pm4py>=2.7.0",
    "pyvis>=0.3.2",
    "jupyterlab>=4.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__init__.py"]
